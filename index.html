<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akurugraphy — How Machines See Language</title>
    <script src="./opentype.min.js"
            onerror="this.onerror=null;var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js';document.head.appendChild(s);"></script>
    <!-- Web fonts are a progressive enhancement only. Loaded non-blocking so an
         offline kiosk never stalls; system-installed Noto Sinhala/Tamil are used
         when offline (the setup script installs them). -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap"
          media="print" onload="this.media='all'">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="progress-bar"></div>

<!-- ═══ AREA 1 ═══ -->
<section id="area-input">
    <div class="input-col">
        <span class="input-label">TYPE YOUR NAME / ඔබේ නම ටයිප් කරන්න / உங்கள் பெயரை தட்டச்சு செய்யுங்கள் 

            
        </span>
        <input type="text" id="textInput" placeholder="Type here! / හෙලෝ / ஹலோ" maxlength="30" autofocus>
        <div id="unicode-seq"></div>
    </div>
    <div class="intro-col">
        <span class="intro-title">How machines see language <br> පරිගණකය බස දකින හැටි <br> கணினிக்கு எழுத்துக்கள் புலப்படும் விதம்

    </div>
</section>

<!-- ═══ AREA 2 ═══ -->
<section id="area-unicode">
    <div id="codepoints-row"></div>
</section>

<!-- ═══ CONNECTOR ═══ -->
<div id="connector">
    <svg id="connector-svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<!-- ═══ AREA 3 ═══ -->
<section id="area-glyph">
    <div id="glyphs-row"></div>
</section>

<div id="detail"></div>

<!-- On-screen print trigger (hidden when printing) -->
<button id="print-btn" type="button">🖨 PRINT / මුද්‍රණය / அச்சிடு</button>

<!-- 80mm thermal receipt — populated on demand, only visible when printing -->
<div id="print-receipt" aria-hidden="true"></div>

<script src="font-data.js" defer></script>
<script src="words.js" defer></script>
<script src="main.js" defer></script>

<div id="demo-hud">
    <span id="demo-status">▶</span>
    <span id="demo-keys">← prev &nbsp; → next &nbsp; ↓ pause &nbsp; ↑ play</span>
</div>
</body>
</html>
